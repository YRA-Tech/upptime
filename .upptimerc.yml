owner: YRA-Tech # GitHub username
repo: upptime # GitHub repository name
sites: # List of endpoints to track
  # Body checks: a 200 alone is not proof of life. From 2026-10-06 to 10-14 the
  # Cloudflare LB had failed yratech.com over to dr1, whose Caddy answers any
  # hostname it doesn't route (stage, academy, sitenotes) with an EMPTY 200 —
  # stage showed "up" here for 8 days while serving nothing. Each check below now
  # also requires content the real origin always returns.
  - name: YRA Tech Stage
    url: https://stage.yratech.com
    __dangerous__body_down_if_text_missing: "</html>"
  - name: YRA Tech Production
    url: https://yratech.com
    __dangerous__body_down_if_text_missing: "</html>"
  # /api/health does a real SELECT 1 and returns 503 when the database is
  # unreachable — the homepage alone stays 200 through a DB outage, so these
  # are what actually catch one (2026-07-22 dbs-prod outage was invisible above)
  # Strict health adds queue-stall + per-capability coverage detection AND is
  # the exact URL the Cloudflare LB fails over on — an issue here means either
  # workers are stalled or a failover to dr1 just happened (2026-08-31 DR build).
  - name: YRA Tech Production Strict (queue + failover signal)
    url: https://yratech.com/api/health?strict=1
  - name: YRA Tech Stage DB health
    url: https://stage.yratech.com/api/health
    __dangerous__body_down_if_text_missing: '"status":"healthy"'
  - name: YRA Tech Production DB health
    url: https://yratech.com/api/health
    __dangerous__body_down_if_text_missing: '"status":"healthy"'
  # Hostnames that ride the yratech.com LB but have no copy on dr1 — the ones a
  # failover silently breaks. Watched so that breakage opens an issue.
  - name: YRA Academy
    url: https://academy.yratech.com
    __dangerous__body_down_if_text_missing: "</html>"
  - name: SiteNotes API
    url: https://sitenotes.yratech.com/health
    __dangerous__body_down_if_text_missing: '"status":"healthy"'
assignees: # Users to assign downtime issues (optional)
  - wittjeff
status-website:
#  cname: status.yratech.com # Custom domain CNAME
#  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  baseUrl: /upptime # where "repo" is your repository name
  name: YRA Tech Status
  navbar:
    - title: YRA Tech home
      href: https://yratech.com
    - title: YRA Tech Stage home
      href: https://stage.yratech.com
    - title: YRA Tech Status
      href: /
    - title: YRA Tech GitHub Org page
      href: https://github.com/YRA-Tech/
    - title: YRA Tech Upptime GitHub Project
      href: https://github.com/YRA-Tech/upptime
  introTitle: "**Upptime** is the open-source uptime monitor and status page, powered entirely by GitHub."
  introMessage: This status page uses **real-time** data from our [GitHub repository](https://github.com/YRA-Tech/upptime).
  

  
